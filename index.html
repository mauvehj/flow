<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExcelGroup Merger - 엑셀 규격 자동 분류 & 병합기</title>
  <meta name="description" content="여러 엑셀 파일을 업로드하면 동일한 컬럼 규격(헤더)을 가진 파일끼리 자동으로 분류하여 하나로 병합해 주는 웹 애플리케이션">

  <!-- Fonts: Pretendard & Inter -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <!-- SheetJS (xlsx) & JSZip -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="dark">
  <div class="app-background">
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>
  </div>

  <!-- Compact Sticky Header -->
  <header class="app-header">
    <div class="container header-container">
      <div class="brand">
        <div class="brand-icon">
          <i data-lucide="layers"></i>
        </div>
        <div class="brand-text">
          <h1>ExcelGroup <span>Merger</span></h1>
          <span class="brand-pill">규격 자동 분류·병합</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-sample-data" class="btn btn-sm btn-glass" title="테스트용 샘플 엑셀 파일 자동 생성 및 시연">
          <i data-lucide="sparkles"></i>
          <span>샘플 데이터 체험</span>
        </button>
        <button id="btn-theme-toggle" class="btn btn-icon-sm" aria-label="테마 전환" title="다크/라이트 모드">
          <i data-lucide="sun" class="sun-icon"></i>
          <i data-lucide="moon" class="moon-icon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container app-main">
    <!-- Compact Upload Strip -->
    <section class="upload-section">
      <div id="drop-zone" class="drop-zone-compact">
        <input type="file" id="file-input" multiple accept=".xlsx, .xls, .csv" class="file-input-hidden">
        <div class="drop-zone-left">
          <div class="upload-icon-small">
            <i data-lucide="file-spreadsheet"></i>
          </div>
          <div class="drop-text-group">
            <span class="drop-title">엑셀 파일들을 끌어다 놓거나 클릭하여 추가</span>
            <span class="drop-subtext">복수 선택 가능 (.xlsx, .xls, .csv 지원)</span>
          </div>
        </div>
        <div class="drop-zone-right">
          <div class="format-badges-inline">
            <span class="badge-mini">XLSX</span>
            <span class="badge-mini">XLS</span>
            <span class="badge-mini">CSV</span>
          </div>
          <button type="button" class="btn btn-sm btn-primary drop-browse-btn">
            <i data-lucide="upload"></i>
            <span>파일 선택</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Compact Options Toolbar -->
    <section class="options-toolbar">
      <div class="toolbar-group">
        <label for="match-mode" class="toolbar-label">
          <i data-lucide="sliders-horizontal"></i>
          <span>판별 기준:</span>
        </label>
        <select id="match-mode" class="form-select-compact">
          <option value="flexible" selected>열 구성 일치 (순서 무관)</option>
          <option value="strict">열 순서까지 엄격 일치</option>
        </select>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-checks">
        <label class="compact-check" title="병합된 데이터에 파일명이 표시되는 __출처_파일명 열 추가">
          <input type="checkbox" id="opt-add-source" checked>
          <span>출처 파일명 열 추가</span>
        </label>
        <label class="compact-check" title="모든 열이 빈 행은 병합 시 제외">
          <input type="checkbox" id="opt-ignore-blank" checked>
          <span>빈 행 제외</span>
        </label>
        <label class="compact-check" title="헤더 앞뒤 공백을 자동으로 다듬어 매칭">
          <input type="checkbox" id="opt-trim-headers" checked>
          <span>헤더 공백 정규화</span>
        </label>
      </div>
    </section>

    <!-- Uploaded Files Strip (Active when files > 0) -->
    <section id="uploaded-files-section" class="uploaded-files-compact hidden">
      <div class="uploaded-bar-header">
        <div class="bar-left">
          <i data-lucide="files"></i>
          <span>업로드된 파일 (<strong id="total-uploaded-count">0</strong>개)</span>
        </div>
        <button id="btn-clear-all" class="btn btn-xs btn-danger-ghost">
          <i data-lucide="trash-2"></i>
          <span>전체 비우기</span>
        </button>
      </div>
      <div id="file-chips-container" class="file-chips-compact">
        <!-- Injected chips -->
      </div>
    </section>

    <!-- Processing / Loading State -->
    <div id="loading-indicator" class="loading-compact hidden">
      <div class="spinner-sm"></div>
      <span id="loading-text">엑셀 파일 규격 분석 중...</span>
    </div>

    <!-- Results Section (Visible after processing) -->
    <section id="results-section" class="results-section hidden">
      <!-- High Density Summary & Action Bar -->
      <div class="results-summary-bar">
        <div class="summary-stats-pills">
          <div class="stat-pill">
            <i data-lucide="files"></i>
            <span>파일 <strong id="stat-total-files">0</strong></span>
          </div>
          <div class="stat-pill highlight-purple">
            <i data-lucide="grid"></i>
            <span>분류 규격 <strong id="stat-total-groups">0</strong></span>
          </div>
          <div class="stat-pill highlight-emerald">
            <i data-lucide="table"></i>
            <span>총 행 수 <strong id="stat-total-rows">0</strong></span>
          </div>
        </div>

        <div class="summary-actions">
          <button id="btn-download-multisheet" class="btn btn-sm btn-primary" title="각 규격을 하나의 엑셀 파일 내 개별 시트로 묶어 다운로드">
            <i data-lucide="file-spreadsheet"></i>
            <span>통합 엑셀 다운로드 (시트별)</span>
          </button>
          <button id="btn-download-zip" class="btn btn-sm btn-secondary" title="각 규격별 완성된 엑셀 파일들을 ZIP 파일로 압축하여 다운로드">
            <i data-lucide="archive"></i>
            <span>ZIP 다운로드</span>
          </button>
        </div>
      </div>

      <!-- Groups List Container (Compact Cards) -->
      <div id="groups-container" class="groups-compact-container">
        <!-- Dynamically rendered compact group cards -->
      </div>
    </section>

    <!-- Subtle Empty State Helper (Minimal footprint) -->
    <div id="empty-state" class="empty-state-minimal">
      <i data-lucide="info"></i>
      <span>상단 영역에 엑셀 파일들을 넣으시거나 <strong>[샘플 데이터 체험]</strong>을 클릭하면 규격별 병합 결과가 표시됩니다.</span>
    </div>
  </main>

  <!-- Data Preview Modal -->
  <div id="preview-modal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-badge" id="modal-group-badge">규격 #1</div>
          <h3 id="modal-title">병합 데이터 미리보기</h3>
        </div>
        <div class="modal-header-actions">
          <button id="btn-modal-export" class="btn btn-sm btn-primary">
            <i data-lucide="download"></i>
            <span>엑셀 다운로드</span>
          </button>
          <button id="btn-modal-close" class="btn btn-icon-sm modal-close-btn" aria-label="닫기">
            <i data-lucide="x"></i>
          </button>
        </div>
      </div>

      <div class="modal-info-bar">
        <div class="modal-stat">
          <span>병합 파일: <strong id="modal-file-count">0</strong>개</span>
          <span class="divider">|</span>
          <span>총 데이터: <strong id="modal-row-count">0</strong>개 행</span>
        </div>
        <div class="modal-search-box">
          <i data-lucide="search"></i>
          <input type="text" id="modal-search-input" placeholder="결과 내 검색...">
        </div>
      </div>

      <div class="table-responsive" id="table-scroll-container">
        <table class="preview-table" id="preview-table">
          <thead id="preview-thead"></thead>
          <tbody id="preview-tbody"></tbody>
        </table>
      </div>

      <div class="modal-footer">
        <div class="pagination-info" id="pagination-info">
          1-50 / 총 120개 행
        </div>
        <div class="pagination-controls">
          <button id="btn-page-prev" class="btn btn-sm btn-glass"><i data-lucide="chevron-left"></i> 이전</button>
          <span id="page-num-display" class="page-badge">1 / 3</span>
          <button id="btn-page-next" class="btn btn-sm btn-glass">다음 <i data-lucide="chevron-right"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/excel-parser.js"></script>
  <script src="js/merger.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
